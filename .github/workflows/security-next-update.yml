name: Security update Next.js

on:
  push:
    branches:
      - security/next-16.3.3

permissions:
  contents: write

jobs:
  update-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/next-16.3.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Update Next.js security release
        run: npm install next@16.3.3 eslint-config-next@16.3.3 --save-exact

      - name: Build
        run: npm run build

      - name: Commit updated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "fix: update Next.js to 16.3.3"
            git push origin HEAD:security/next-16.3.3
          fi
