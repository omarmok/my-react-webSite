name: Security lockfile refresh

on:
  push:
    branches:
      - security/dependency-fixes-2026-08

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Refresh package-lock for patched Next.js
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.2.12 eslint-config-next@16.2.12

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet package-lock.json package.json; then
            echo "No lockfile changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore(security): pin patched dependency versions"
          git push
